<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

    <div class="form-box">

        <h1>Create Account 🚀</h1>

        <input
        type="text"
        id="name"
        placeholder="Name">

        <input
        type="email"
        id="email"
        placeholder="Email">

        <input
        type="password"
        id="password"
        placeholder="Password">

        <button onclick="register()">
            Register
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
